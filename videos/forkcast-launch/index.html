<!doctype html>

    <meta charset="UTF-8" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0E1726;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="168"
      data-width="1920"
      data-height="1080"

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-bind", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-02-promise", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to("#el-02-promise", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-03-read", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.to("#el-03-read", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.fromTo("#el-04-engine", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.to("#el-04-engine", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 60);
        tl.fromTo("#el-05-futures", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 60);
        tl.to("#el-05-futures", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 87);
        tl.fromTo("#el-06-recommend", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 87);
        tl.to("#el-06-recommend", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 102);
        tl.fromTo("#el-07-verify", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 102);
        tl.to("#el-07-verify", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 124);
        tl.fromTo("#el-08-challenge", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 124);
        tl.to("#el-08-challenge", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 144);
        tl.fromTo("#el-09-boundary", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 144);
        tl.to("#el-09-boundary", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 160);
        tl.fromTo("#el-10-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 160);
        tl.to({}, { duration: 168 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
